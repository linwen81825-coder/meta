seed: 1
device: cuda

dataset:
  name: cifar10
  data_root: ./save/66
  num_classes: 10
  num_clients: 10
  alpha: 0.1
  long_tail:
    enabled: false
    mode: geometric
    decay_factor: 0.9
    class_order: natural
    shuffle: true
    min_samples_per_class: 1
    max_samples_per_class: null
  label_noise:
  label_noise:
    enabled: true
    mode: symmetric
    # constant：
    # 所有客户端都使用 noise_rate
    # auto：
    # 自动为不同客户端生成不同噪声率
    rate_mode: auto
    # rate_mode=constant 时使用
    noise_rate: 0.2
    # rate_mode=auto 时使用
    auto:
      # 推荐 linspace_shuffle
      distribution: linspace_shuffle
      # 自动生成的最小、最大噪声率
      min_rate: 0.0
      max_rate: 0.6
      rate_seed: 2026
    seed_offset: 10000
    # 保留手动覆盖能力。
    client_noise_rates: null

model:
  num_experts: 4
  expert_hidden_dim: 2048
  top_k: 2

train:
  rounds: 50
  clients_per_round: 10
  local_epochs: 1
  batch_size: 64
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  test_batch_size: 256
  num_workers: 2
  router_balance_weight: 0.01

server:
  val_size: 1000
  val_batch_size: 256

meta:
  hidden_dim: 32
  lr: 0.001
  steps: 1
  max_val_batches: 4
  tau: 0.5
  # 可选：
  # constant    固定温度
  # linear      线性退火
  # exponential 指数退火
  tau_schedule: exponential
  # 第1轮使用的温度。
  tau_start: 1.0
  # 最后一个退火轮次使用的温度。
  tau_end: 0.3
  # null 表示自动使用 train.rounds。
  # 例如 train.rounds=50，则第1轮为1.0，第50轮为0.3。
  # 如果设为30，则第30轮下降到0.3，第31轮以后保持0.3。
  tau_anneal_rounds: null
  input_features:
    - loss_z
    - sample_ratio
    - expert_freq
    - delta_norm_z
    - expert_loss_z
    - loss_raw
    - expert_loss_raw
    - expert_count_ratio
  active_mask: true
  active_threshold: 0.0
  min_active_clients_per_expert: 2
   # 每个客户端在本地训练前随机前向多少个batch。
  pre_probe_batches: 4
  # 训练前probe的batch size。
  # probe loader与本地训练loader相互独立。
  pre_probe_batch_size: 64
  # true：
  # 元网络更新后的第二次输入，仍使用训练前probe的
  # loss和专家激活比例。
  #
  # false：
  # 元网络更新后的第二次输入，改用本地训练过程中统计的
  # 平均loss和专家激活比例。
  second_input_same_as_first: false

  
aggregation:
  # non_expert_agg 支持：uniform / sample_weighted
  non_expert_agg: sample_weighted

  # expert_agg 支持：uniform / sample_weighted / meta_network / expert_activation_count_weighted
  expert_agg: meta_network

reproducibility:
  enabled: true

  # 遇到非确定性 CUDA 算子时直接报错，而不是静默继续
  strict_determinism: true

  # 严格复现实验阶段固定为单进程数据加载
  force_num_workers_zero: true

  # 禁止不同 GPU 上可能采用的 TF32 数值路径
  disable_tf32: true

  # 以下诊断只写入日志，不打印到控制台
  log_environment: true
  log_initial_state_hash: true
  log_first_round_client_hashes: true
  log_global_state_hash_each_round: true