seed: 1
device: cuda

dataset:
  name: cifar10
  data_root: ./data
  num_classes: 10
  num_clients: 10
  alpha: 0.1
  long_tail:
    enabled: true
    mode: geometric
    decay_factor: 0.9
    class_order: natural
    shuffle: true
    min_samples_per_class: 1
    max_samples_per_class: null
  label_noise:
    enabled: true
    mode: symmetric
    noise_rate: 0.2
    seed_offset: 10000
    client_noise_rates: null

model:
  num_experts: 4
  expert_hidden_dim: 2048
  top_k: 2

train:
  rounds: 50
  clients_per_round: 10
  local_epochs: 1
  batch_size: 64
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  test_batch_size: 256
  num_workers: 2
  router_balance_weight: 0.01

server:
  val_size: 1000
  val_batch_size: 256

meta:
  hidden_dim: 32
  lr: 0.001
  steps: 1
  max_val_batches: 4
  tau: 0.5
  input_features:
    - loss_z
    - sample_ratio
    - expert_freq
    - delta_norm_z
    - expert_loss_z
    - loss_raw
    - expert_loss_raw
    - expert_count_ratio
  active_mask: true
  active_threshold: 0.0
  min_active_clients_per_expert: 2
  
aggregation:
  # non_expert_agg 支持：uniform / sample_weighted
  non_expert_agg: sample_weighted

  # expert_agg 支持：uniform / sample_weighted / meta_network / expert_activation_count_weighted
  expert_agg: meta_network

reproducibility:
  enabled: true

  # 遇到非确定性 CUDA 算子时直接报错，而不是静默继续
  strict_determinism: true

  # 严格复现实验阶段固定为单进程数据加载
  force_num_workers_zero: true

  # 禁止不同 GPU 上可能采用的 TF32 数值路径
  disable_tf32: true

  # 以下诊断只写入日志，不打印到控制台
  log_environment: true
  log_initial_state_hash: true
  log_first_round_client_hashes: true
  log_global_state_hash_each_round: true